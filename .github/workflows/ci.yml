name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build extension binary
        run: go build -o gh-user-attachment .

      - name: Smoke test binary
        run: ./gh-user-attachment --help >/dev/null
