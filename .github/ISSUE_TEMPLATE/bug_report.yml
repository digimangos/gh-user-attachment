name: Bug report
description: Report a reproducible problem.
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Remove secrets and personal information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, relevant configuration, and error output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the extension and GitHub CLI are you using?
